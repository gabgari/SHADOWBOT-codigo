org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m
# Bajado de -Xmx8G/-XX:MaxMetaspaceSize=4G: este equipo tiene 6.9 GB de RAM
# total, así que ese límite pedía más memoria de la que existe físicamente
# y corrompía la caché incremental de Kotlin a medio escribir
# ("Could not close incremental caches..."). Súbelo solo si el equipo
# donde compilas tiene bastante más RAM libre.
kotlin.incremental=false
org.gradle.daemon=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
